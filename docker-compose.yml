# docker compose up -d   แล้วเปิด http://localhost:3210
# ตั้งค่าใน .env (คัดลอกจาก .env.example) - compose ส่งเข้า container ให้ทั้งไฟล์
services:
  app:
    build: .
    # ใช้ image สำเร็จรูปแทนการ build เอง: คอมเมนต์บรรทัด build แล้วเปิดบรรทัดล่าง
    # image: ghcr.io/panudeth/office-dd:latest
    ports:
      - '3210:3210'
    env_file:
      - path: .env
        required: false
    environment:
      # Ollama รันบนเครื่อง host ตามปกติ (GPU ใช้ได้เต็ม) - ในนี้ localhost คือตัว container เอง
      # จึงชี้ผ่าน host.docker.internal แทน / ตั้ง OPENAI_BASE_URL ใน .env เองได้ ค่านั้นชนะ
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-http://host.docker.internal:11434/v1}
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped
